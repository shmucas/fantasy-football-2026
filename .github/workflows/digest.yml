# Daily digest: trade ideas and start/sit advice, posted to Discord.
#
# This runs here rather than on the laptop because a laptop schedule only
# fires when the lid is open. The job that used to do this via launchd went
# six days without posting and looked healthy the whole time.
#
# It reads only. Every mutation in ffb.sleeper_auth is gated behind
# FFB_ALLOW_WRITES, which is never set here, so the worst a bad run can do is
# describe a move it will not make. That is also why SLEEPER_TOKEN is
# deliberately not a secret on this repo: the digest talks to Sleeper's public
# API, and an account token that can write a roster has no business on a
# public repository's runners.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DISCORD_WEBHOOK_URL - the Discord incoming webhook to post into
#
# What the digest said last time lives in state/digest.json in this repo, and
# the job commits it back. It used to be a table in hosted Postgres, which the
# runners could not reach once the website that database served was removed.

name: Digest

# Each section runs on its own clock, because they move at different speeds.
# This used to fire three times a day with everything in it, which meant the
# same trade ideas landed in Discord ~20 times a week until a roster changed.
#
# Times are UTC and GitHub does not do daylight saving, so each slot is listed
# for both EDT and EST rather than drifting an hour in November.
on:
  schedule:
    # Tuesday evening: the last useful moment to review the wire. Claims
    # process in the early hours of Wednesday, so advice that lands after
    # that is about a wire that no longer exists.
    - cron: "23 23 * * 2"
    - cron: "23 0 * * 3"
    # Wednesday morning: waiver claims have processed overnight, so rosters
    # have just moved. That is the only time trade ideas actually change.
    - cron: "7 12 * * 3"
    - cron: "7 13 * * 3"
    # Thursday evening: last look at the lineup before TNF locks.
    - cron: "23 22 * * 4"
    - cron: "23 23 * * 4"
    # Sunday late morning: inactives drop about 90 minutes before the 1pm ET
    # window. This is the run that catches a starter who has just been ruled
    # out, which is the whole point of the start/sit half. It is also the
    # weekly heartbeat, so it posts whether or not anything changed.
    - cron: "15 15 * * 0"
    - cron: "15 16 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many trade ideas to show per league"
        type: string
        default: "3"
      sections:
        description: "Sections to run: trades, waivers, inbox, lineup"
        type: string
        default: "trades,waivers,inbox,lineup"
      force:
        description: "Post even if nothing changed"
        type: boolean
        default: false

# Two digests posting at once would just be noise.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # To push state/digest.json back. A push made with GITHUB_TOKEN does not
    # start another workflow run, so this cannot loop.
    permissions:
      contents: write
      # To file an issue when a run fails, which is how a failure reaches
      # you when Discord is the thing that is broken.
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          # Either route is fine: the bot needs a token and a channel, the
          # webhook needs a URL. Requiring the webhook specifically would fail a
          # perfectly working bot setup.
          if [ -n "$DISCORD_BOT_TOKEN" ] && [ -n "$DISCORD_CHANNEL_ID" ]; then
            echo "Discord: posting as the bot."
          elif [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord: posting to the webhook."
          else
            echo "No way to reach Discord: set DISCORD_BOT_TOKEN and DISCORD_CHANNEL_ID, or DISCORD_WEBHOOK_URL"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync

      - name: Run digest
        working-directory: backend
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          FFB_SLEEPER_USER_ID: "1125887731814576128"
        run: |
          # Which sections this run cares about, chosen by the schedule that
          # woke it. A manual run says so explicitly.
          case "${{ github.event.schedule }}" in
            "23 23 * * 2"|"23 0 * * 3")  sections="waivers,inbox"; force="" ;;
            "7 12 * * 3"|"7 13 * * 3")   sections="trades,inbox"; force="" ;;
            "23 22 * * 4"|"23 23 * * 4") sections="lineup,inbox";  force="" ;;
            "15 15 * * 0"|"15 16 * * 0") sections="lineup,inbox";  force="--force" ;;
            *) sections="${{ inputs.sections || 'trades,waivers,inbox,lineup' }}"
               force="${{ inputs.force && '--force' || '' }}" ;;
          esac

          # The digest exits non-zero when a league could not be evaluated,
          # which is deliberate: a job that cannot look must not report the
          # same green as a job that looked and found nothing. On a schedule
          # that means a permanent red X for a league that has not drafted
          # yet, and a workflow that is always red is a workflow nobody reads.
          #
          # So the exit code alone is not the verdict here. What matters is that
          # the digest reached a decision: it either posted, or it deliberately
          # stayed quiet because nothing changed. Anything else is a failure.
          #
          # That second case is new and is why this check is not just a grep
          # for "posted": most runs now have nothing to say, and a silent run
          # is the mechanism working rather than a broken job.
          set +e
          uv run python -m ffb.alerts.digest \
            --limit "${{ inputs.limit || '3' }}" \
            --sections "$sections" $force 2>&1 | tee digest.out
          status=${PIPESTATUS[0]}
          set -e

          if grep -q "(not posted: nothing changed" digest.out; then
            echo "Nothing changed since the last run, so nothing was posted."
            exit 0
          fi

          if ! grep -q "(posted to Discord)" digest.out; then
            echo "::error::The digest did not reach Discord (exit $status)."
            exit "${status:-1}"
          fi

          if [ "$status" -ne 0 ]; then
            echo "::warning::Posted, but at least one league could not be evaluated. See the log."
          fi

      # The state the alerters keep is a file in this repo now, so it has to be
      # pushed back or the next run starts blank and repeats itself. Runs even
      # when the job failed: a partial run may still have recorded something.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to push."
            exit 0
          fi
          git commit -m "Digest state"
          # The digest and the injury watch overlap on Thursday evening, so two
          # jobs can push within seconds of each other and one will be rejected.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing on what landed first (attempt $attempt)."
            git pull --rebase --autostash || exit 1
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1

      # The thing that tells you it broke must not be the thing that broke.
      # Discord deleted the webhook on 25 September and nothing said so for a
      # week, because the only way this job had to reach you was that webhook.
      # A GitHub issue arrives by email through GitHub's own notifications,
      # which depend on neither Discord nor Sleeper.
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Digest is failing"
          # One open issue at a time, or every scheduled run files another.
          open=$(gh issue list --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for this."
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n' \
            "The scheduled digest failed and nothing reached Discord." \
            "" \
            "Failing run: $url" \
            "" \
            "Most likely causes, in order:" \
            "" \
            "- The Discord webhook was deleted. The log says the webhook no longer exists (404). Discord deletes a webhook when it finds the URL somewhere public. Make a new one in Server Settings > Integrations > Webhooks, then run: gh secret set DISCORD_WEBHOOK_URL" \
            "- The Sleeper token expired. It lasts a year from the day it was issued." \
            "- Something upstream changed shape and the job raised. The log says which." \
            "" \
            "This issue closes itself on the next run that succeeds.")
          gh issue create --title "$title" --body "$body"

      # Close the alert once it works again, so an open issue always means it is
      # broken now rather than that it broke once in September.
      - name: Clear the failure report
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Digest is failing"
          open=$(gh issue list --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Working again as of this run."
          fi
