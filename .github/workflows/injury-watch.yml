# Injury watch: diff the NFL injury report against what we last announced and
# post the changes to Discord.
#
# It runs here rather than on the laptop because a laptop schedule only fires
# when the lid is open.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DISCORD_WEBHOOK_URL - the Discord incoming webhook to post into
#
# The "what did we say last time" state lives in state/injuries.json in this
# repo, and the job commits it back. It used to be a table in hosted Postgres,
# whose direct host is IPv6-only and so unreachable from Actions runners.

name: Injury watch

on:
  schedule:
    # Times are UTC and GitHub does not do daylight saving, so these are spans
    # wide enough to cover both EDT and EST. Re-running is cheap: the diff is
    # silent when nothing changed, so an extra run costs a minute, not a ping.
    #
    # Wed/Thu/Fri evening - practice reports and Friday's final game status.
    - cron: "0 22 * * 3,4,5"
    # Thursday and Monday late evening - TNF/MNF inactives.
    - cron: "45 22 * * 1,4"
    - cron: "45 23 * * 1,4"
    # Sunday through the day - covers inactives 90 minutes before the 1pm and
    # 4pm ET windows under either offset, plus the Sunday night game.
    - cron: "0 14-23 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even on the first run for a season"
        type: boolean
        default: false
      dry_run:
        description: "Print the message instead of posting to Discord"
        type: boolean
        default: false

# Two runs writing injury state at once would fight over the same rows.
concurrency:
  group: injury-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # To push state/injuries.json back. A push made with GITHUB_TOKEN does not
    # start another workflow run, so this cannot loop.
    permissions:
      contents: write
      # To file an issue when a run fails, which is how a failure reaches
      # you when Discord is the thing that is broken.
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL secret is not set"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync

      - name: Run injury watch
        working-directory: backend
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Set an FFB_SEASON repository variable to override, for example to
          # 2025 while nflverse has no injury data for the coming season.
          FFB_SEASON: ${{ vars.FFB_SEASON || '2026' }}
        run: |
          uv run python -m ffb.alerts.injuries \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # The state the alerters keep is a file in this repo now, so it has to be
      # pushed back or the next run starts blank and repeats itself. Runs even
      # when the job failed: a partial run may still have recorded something.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to push."
            exit 0
          fi
          git commit -m "Injury state"
          # The digest and the injury watch overlap on Thursday evening, so two
          # jobs can push within seconds of each other and one will be rejected.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing on what landed first (attempt $attempt)."
            git pull --rebase --autostash || exit 1
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1

      # The thing that tells you it broke must not be the thing that broke.
      # Discord deleted the webhook on 25 September and nothing said so for a
      # week, because the only way this job had to reach you was that webhook.
      # A GitHub issue arrives by email through GitHub's own notifications,
      # which depend on neither Discord nor Sleeper.
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Injury watch is failing"
          # One open issue at a time, or every scheduled run files another.
          open=$(gh issue list --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is already open for this."
            exit 0
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n' \
            "The injury watch failed and nothing reached Discord." \
            "" \
            "Failing run: $url" \
            "" \
            "Most likely causes, in order:" \
            "" \
            "- The Discord webhook was deleted. The log says the webhook no longer exists (404). Discord deletes a webhook when it finds the URL somewhere public. Make a new one in Server Settings > Integrations > Webhooks, then run: gh secret set DISCORD_WEBHOOK_URL" \
            "- The Sleeper token expired. It lasts a year from the day it was issued." \
            "- Something upstream changed shape and the job raised. The log says which." \
            "" \
            "This issue closes itself on the next run that succeeds.")
          gh issue create --title "$title" --body "$body"

      # Close the alert once it works again, so an open issue always means it is
      # broken now rather than that it broke once in September.
      - name: Clear the failure report
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Injury watch is failing"
          open=$(gh issue list --state open --search "in:title \"$title\"" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Working again as of this run."
          fi
